<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>3rd Grade Math Practice</title>
<script src="voice.js"></script>
<style>
/* ---------- Colors ----------
   Dyslexia-friendly: dark navy (not black) text on light, soft (not pure white) backgrounds.
   Every button is a bright pastel with dark text. No dark blocks anywhere.
   Multiplication = pastel magenta, Division = pastel teal. */
:root{
  --bg:#E9EFF4; --surface:#FBFCF8; --ink:#1E2B4A; --line:#C9D5E0; --stripe:#E6EDF3;
  --mag:#F6B8E6; --mag-line:#C25CA6; --mag-pale:#FBE3F4;
  --teal:#A6E6E0; --teal-line:#2F9C94; --teal-pale:#DDF4F2;
  --go:#BDEFC8; --go-line:#4FAE68;          /* check key, correct answers */
  --calm:#DCE4EC; --calm-line:#A9BACB;      /* back, erase, speaker */
  --hl:#FFE89A;                             /* yellow "you are here" highlight */
  --pstripe:#CFE3F7; --psq:#F6C6E8; --chunk:#5A6E8C;  /* chunk lines: soft navy, not black */        /* brighter stripes and squares for paper, which prints lighter */
  --acc:var(--calm); --acc-line:var(--calm-line); --acc-pale:var(--stripe);
}
body[data-side="mul"]{--acc:var(--mag);--acc-line:var(--mag-line);--acc-pale:var(--mag-pale)}
body[data-side="div"]{--acc:var(--teal);--acc-line:var(--teal-line);--acc-pale:var(--teal-pale)}

body{font-family:Verdana,Tahoma,sans-serif;background:var(--bg);color:var(--ink);text-align:center;margin:0;padding:12px;letter-spacing:.05em}
h1{font-size:18px;font-weight:normal;color:#4A5873;margin:4px 0 2px}   /* app name: small, quiet */
button{font-family:inherit;font-size:24px;margin:5px;padding:14px 18px;border:3px solid var(--acc-line);border-radius:14px;background:var(--acc);color:var(--ink);font-weight:bold;min-width:64px;cursor:pointer;touch-action:manipulation}
button:active{transform:scale(.96)}
.big{background:var(--go);border-color:var(--go-line)}
.soft{background:var(--calm);border-color:var(--calm-line)}
#q{font-size:clamp(44px,13vw,60px);margin:10px;font-weight:bold}
/* Page and activity titles are plain bold text, so they never look like buttons */
#modeName{font-size:30px;font-weight:bold;color:var(--ink);margin:6px 0}

/* Menus: one column */
.menu{max-width:520px;margin:0 auto}
.door{display:flex;align-items:center;justify-content:center;gap:18px;width:100%;min-height:140px;margin:16px 0;font-size:30px;line-height:1.25;border-radius:22px;text-align:left;color:var(--ink)}
.door.mul{background:var(--mag);border:4px solid var(--mag-line)}
.door.div{background:var(--teal);border:4px solid var(--teal-line)}
.secthead{font-size:min(34px,6.3vw);white-space:nowrap;font-weight:bold;color:var(--ink);margin:6px 0 6px;line-height:1.25}   /* page title: big, always one line */
.card{display:flex;align-items:center;gap:14px;width:100%;margin:10px 0;padding:14px 16px;background:var(--surface);color:var(--ink);border:3px solid var(--acc-line);text-align:left;font-weight:normal}
.card .ic{font-size:38px;flex:none}
.card b,.sect b{display:block;font-size:24px}
.sect{background:var(--surface);border:3px solid var(--acc-line);border-radius:14px;padding:14px 16px;margin:10px 0;text-align:left}
.picks{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:10px}
.picks button{margin:0;padding:12px 0;font-size:24px;min-width:0}
/* Speaker buttons: light box so the speaker icon is easy to see */
.say{background:var(--calm);border-color:var(--calm-line);font-size:28px;padding:6px 18px}
/* Math signs on the big buttons */
.sign{color:var(--ink);font-weight:bold;font-family:Arial,Verdana,sans-serif;line-height:1}
.door .sign{font-size:72px;width:64px;text-align:center}
.secthead .sign{font-size:30px;margin-right:4px}

/* Practice screen */
#entry{font-size:52px;min-height:64px;border-bottom:4px solid var(--acc-line);width:180px;margin:0 auto 10px}
#pad{max-width:330px;margin:auto}
#pad button{width:90px;height:72px;font-size:34px;padding:0}
#msg{font-size:26px;min-height:70px;margin:8px;line-height:1.5}
#stars{font-size:32px}

/* Fact family triangle: 3 big numbers close together */
.tri{position:relative;width:260px;height:210px;margin:6px auto}
.tri svg{position:absolute;inset:0;width:100%;height:100%}
.tri polygon{fill:var(--teal-pale);stroke:var(--teal-line)}
.tri .c{position:absolute;width:84px;height:84px;border-radius:50%;background:var(--surface);border:4px solid var(--teal-line);font-size:34px;font-weight:bold;line-height:76px;box-sizing:border-box}
.tri .c.top{left:88px;top:0}.tri .c.left{left:0;top:126px}.tri .c.right{right:0;top:126px}
.tri .c.hole{background:var(--hl);border-color:var(--teal-line)}
.tri .c.good{background:var(--go);border-color:var(--go-line)}

/* Division groups: each group is its own box, spaced apart, tap to count */
#dots p{font-size:22px;margin:8px;line-height:1.4}
#groups{display:grid;grid-template-columns:repeat(3,auto);justify-content:center;gap:16px;margin:12px auto}
@media(min-width:640px){#groups{grid-template-columns:repeat(4,auto)}}
.grp{position:relative;display:grid;gap:6px;padding:16px 12px 12px 22px;border-radius:14px;border:4px solid var(--line);background:var(--surface);cursor:pointer;justify-content:center;align-content:center;touch-action:manipulation}
.grp.done{border-color:var(--teal-line);background:var(--teal-pale)}
.grp .n{position:absolute;top:-12px;left:-12px;width:30px;height:30px;line-height:26px;border-radius:50%;background:var(--teal);border:2px solid var(--teal-line);color:var(--ink);font-size:19px;font-weight:bold;box-sizing:border-box}
.dot{width:14px;height:14px;border-radius:50%;background:var(--ink)}
.hint{color:var(--ink)}

/* Chart */
#chartView h2{font-size:34px;margin:6px 0 6px;color:var(--ink)}
#fact{font-size:40px;font-weight:bold;min-height:56px;margin:6px}
#wrap{overflow-x:auto;margin:0 auto;max-width:100%}
#grid{border-collapse:collapse;margin:0 auto;font-size:clamp(14px,3.6vw,24px)}
/* Same design as the printed grid: color lanes, neutral top row, only bold lines every 3 */
#grid{border:3px solid var(--chunk)}
#grid td,#grid th{width:2.1em;height:2.1em;text-align:center;border:0;cursor:pointer;padding:0}
#grid th{font-weight:bold}
#grid tr:nth-child(n) > *{background:#fff}                       /* rows 1, 3, 5... white */
#grid tr:nth-child(6n+3) > *{background:#CFE3F7}                  /* rows 2, 8   blue   */
#grid tr:nth-child(6n+5) > *{background:#CDEFD6}                  /* rows 4, 10  green  */
#grid tr:nth-child(6n+1):not(:first-child) > *{background:#FFEEA0} /* rows 6, 12  yellow */
#grid tr:first-child > *{background:#DCE4EC;border-bottom:3px solid var(--chunk)}  /* top row: neutral */
#grid tr > :first-child{border-right:3px solid var(--chunk)}
#grid tr:nth-child(3n+1):not(:first-child):not(:last-child) > *{border-bottom:4px solid var(--chunk)}
#grid tr > :nth-child(3n+1):not(:first-child):not(:last-child){border-right:4px solid var(--chunk)}
#grid td.sq{font-weight:bold}
/* tapping: the chosen row and column keep their colors, the rest fades, the answer is circled */
#grid tr:nth-child(n) th.on{outline:3px solid var(--ink);outline-offset:-3px}
#grid tr:nth-child(n) td.hit{background:var(--mag);font-weight:bold;outline:3px solid var(--ink);outline-offset:-3px}
#grid.focusing td:not(.on){opacity:.25}

/* Toggle buttons: outlined = off, filled pastel = on */
.tabs button,#pickL button{background:var(--surface);color:var(--ink);border:3px solid var(--line);font-weight:normal}
.tabs button.sel,#pickL button.sel{background:var(--mag);border-color:var(--mag-line);font-weight:bold}

/* Lists: one table at a time, big and spaced out */
#pickL button{min-width:56px;padding:8px 10px;font-size:22px}
#list{margin:12px auto;border-collapse:collapse;font-size:clamp(28px,7vw,42px)}
#list td{padding:.1em .22em}
#list tr{cursor:pointer}
#list tr:nth-child(odd){background:var(--stripe)}
#list tr:nth-child(even){background:var(--surface)}
#list tr.on{background:var(--hl);outline:4px solid var(--mag-line)}
#list td.n{text-align:right}
#list td.c{text-align:left;font-weight:bold;min-width:2.2em}
#printArea{display:none}

@media print{
  body{background:#fff;padding:0}
  h1,.menu,#game,.noprint{display:none!important}
  body[data-print="grid"] #chartView{display:block!important}
  body[data-print="grid"] #listsPane{display:none!important}
  body[data-print="grid"] #gridPane{display:block!important}
  body[data-print="lists"] #chartView{display:none!important}
  body[data-print="lists"] #printArea{display:block!important}
  #grid td{opacity:1!important}
  /* --- Printed tables: big text, roomy rows, thick "chunk" lines after rows 3, 6 and 9 --- */
  #printArea table{margin:0 auto;border-collapse:collapse;font-size:34px;line-height:1.55;letter-spacing:.03em}
  #printArea td{padding:0 4px;border-bottom:2px solid #9AABBF}   /* a line under every row */
  #printArea td:first-child{padding-left:.4em}
  #printArea td:last-child{padding-right:.4em}
  #printArea td.n{text-align:right}
  #printArea td.c{text-align:left;font-weight:bold;min-width:2.2em}
  #printArea tr:nth-child(odd){background:var(--pstripe)}
  #printArea tr:nth-child(3n):not(:last-child) td{border-bottom:4px solid var(--chunk)}
  #printArea .box{break-inside:avoid}
  #printArea h3{margin:0 0 10px;font-size:34px;color:var(--ink);border-radius:10px;padding:6px 4px}
  /* Each table has its own color: header plus matching row stripes, so his eyes can find it.
     1s, 4s, 7s, 10s = pink   2s, 5s, 8s, 11s = blue   3s, 6s, 9s, 12s = green */
  #printArea .c1 h3{background:#F6B8E6;border:3px solid #C25CA6} #printArea .c1 tr:nth-child(odd){background:#F9D2EE}
  #printArea .c2 h3{background:#B7D9F7;border:3px solid #4A8CC9} #printArea .c2 tr:nth-child(odd){background:#CFE3F7}
  #printArea .c3 h3{background:#B5E8C1;border:3px solid #4FAE68} #printArea .c3 tr:nth-child(odd){background:#CDEFD6}
  /* All 12: 3 tables side by side with wide white gaps, 4 pages */
  /* Each printed page is a "sheet": content at the top, page number at the bottom */
  #printArea .sheet{height:10in;display:flex;flex-direction:column;break-after:page;break-inside:avoid}
  #printArea .sheet:last-child{break-after:auto}
  #printArea .pfoot{margin-top:auto;font-size:18px;color:var(--ink);text-align:center}
  #printArea .pg{display:grid;grid-template-columns:repeat(3,1fr);gap:.7in}
  #printArea .pg table{width:100%;font-size:27px;line-height:2.5}   /* narrow columns, tall roomy rows */
  #printArea .pg h3{font-size:30px}
  #printArea .pg td.c{width:100%}   /* extra width goes after the answer, so each fact stays tight */
  /* One table per page, portrait, as big as it fits */
  #printArea .one .box{display:table;margin:0 auto}
  #printArea .one h3{font-size:46px;margin-bottom:12px}
  #printArea .one table{font-size:46px;line-height:1.4}

  /* --- Printed grid: bigger cells, chunk lines every 3 rows and columns --- */
  #chartView h2{display:inline-block;font-size:22px;margin:0 0 4px;padding:2px 18px;background:#DCE4EC;border:3px solid #A9BACB;border-radius:24px;color:var(--ink)}
  #grid{font-size:26px}
  #grid{border:3px solid var(--chunk)}
  #grid td,#grid th{border:0;width:54px;height:68px}   /* no thin lines: they crowd the numbers */   /* portrait: narrower cells, taller rows */
  #grid tr:first-child > *{border-bottom:3px solid var(--chunk)}
  #grid tr > :first-child{border-right:3px solid var(--chunk)}
  #grid tr:nth-child(3n+1):not(:first-child):not(:last-child) > *{border-bottom:5px solid var(--chunk)}
  #grid tr > :nth-child(3n+1):not(:first-child):not(:last-child){border-right:5px solid var(--chunk)}
  #grid td.on,#grid td.hit{color:var(--ink)!important;font-weight:normal}
  #grid tr:nth-child(n) td{background:#fff!important}             /* rows 1, 3, 5... white (squares too) */
  #grid tr:nth-child(6n+3) td{background:#CFE3F7!important}          /* rows 2, 8   blue   */
  #grid tr:nth-child(6n+5) td{background:#CDEFD6!important}          /* rows 4, 10  green  */
  #grid tr:nth-child(6n+1):not(:first-child) td{background:#FFEEA0!important}  /* rows 6, 12 yellow */
  /* square numbers (1, 4, 9 ... 144): same color as their row, just bold */
  #grid tr:nth-child(n) td.sq{font-weight:bold}
  /* row labels on the left take their row's color, so each color lane starts at its number */
  #grid tr:nth-child(n+2) th{background:#fff!important}
  #grid tr:nth-child(6n+3) th{background:#CFE3F7!important}
  #grid tr:nth-child(6n+5) th{background:#CDEFD6!important}
  #grid tr:nth-child(6n+1):not(:first-child) th{background:#FFEEA0!important}
  #grid th.on{background:#DCE4EC!important;color:var(--ink)}
  /* top row and the corner: calm neutral instead of pink */
  #grid tr:first-child th{background:#DCE4EC!important}
  #grid tr:nth-child(n) td.hit,#grid tr:nth-child(n) th.on{outline:0}   /* taps don't print */
  #grid tr:nth-child(n) td.hit{font-weight:normal}
  #grid tr:nth-child(n) td.sq.hit{font-weight:bold}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
</style>
<style id="pageSize">@page{size:landscape;margin:.4in}</style>
</head>
<body>
<h1>3rd Grade Math Practice</h1>

<!-- Home: just two doors -->
<div id="doors" class="menu">
  <button class="door mul" onclick="openSide('mul')"><span class="sign">×</span>Multiplication<br>Practice</button>
  <button class="door div" onclick="openSide('div')"><span class="sign">÷</span>Division<br>Practice</button>
</div>

<!-- Behind the green door -->
<div id="mulMenu" class="menu" hidden>
  <div class="secthead"><span class="sign">×</span> Multiplication Practice</div>
  <button class="card" onclick="openChart()"><span class="ic">📋</span><b>Look at the tables</b></button>
  <div class="sect">
    <b>Practice one table</b>
    <div id="tables" class="picks"></div>
  </div>
  <button class="card" onclick="start('mix')"><span class="ic">🔀</span><b>Practice all tables, mixed</b></button>
  <button class="card" onclick="openPrint()"><span class="ic">🖨</span><b>Print study sheets</b></button>
  <button class="soft" onclick="home()">⬅ Home</button>
</div>

<!-- Paper copies for studying and the fridge -->
<div id="printMenu" class="menu" hidden>
  <div class="secthead">🖨 Print study sheets</div>
  <button class="card" onclick="printLists('all')"><span class="ic">📄</span><b>All 12 tables · 4 pages</b></button>
  <button class="card" onclick="printLists('each')"><span class="ic">📚</span><b>All 12, one per page · 12 pages</b></button>
  <div class="sect">
    <b>One table, big</b>
    <div id="printPick" class="picks"></div>
  </div>
  <button class="card" onclick="printGrid()"><span class="ic">🔢</span><b>Times table grid</b></button>
  <button class="soft" onclick="goBack()">⬅ Back</button>
</div>

<!-- Behind the orange door -->
<div id="divMenu" class="menu" hidden>
  <div class="secthead"><span class="sign">÷</span> Division Practice</div>
  <button class="card" onclick="start('div')"><span class="ic">🟦</span><b>Division groups</b></button>
  <button class="card" onclick="start('fam')"><span class="ic">🔺</span><b>Fact families</b></button>
  <button class="card" onclick="location.href='division.html'"><span class="ic">👀</span><b>Division Lab</b></button>
  <button class="soft" onclick="home()">⬅ Home</button>
</div>

<div id="chartView" hidden>
  <h2>Times Tables</h2>
  <div class="tabs noprint">
    <button id="tabL" onclick="tab('lists')">Lists</button>
    <button id="tabG" onclick="tab('grid')">Grid</button>
  </div>

  <div id="listsPane">
    <div id="pickL" class="noprint"></div>
    <table id="list"></table>
    <div class="noprint">
      <button class="big" id="readBtn" onclick="readAll()">▶ Read it to me</button><br>
      <button id="countBtn" onclick="readCount()">🔢 Count by 1s</button>
    </div>
  </div>

  <div id="gridPane" hidden>
    <div id="fact" class="noprint">Tap a number</div>
    <div id="wrap"><table id="grid"></table></div>
  </div>

  <div class="noprint"><button class="soft" onclick="goBack()">⬅ Back</button></div>
</div>
<div id="printArea"></div>

<div id="game" hidden>
  <div id="modeName"></div>
  <div id="stars"></div>
  <div id="q"></div>
  <button class="say" onclick="say()" aria-label="Read it to me">🔊</button>
  <div id="dots"></div>
  <div id="entry"></div>
  <div id="pad"></div>
  <div id="msg"></div>
  <button class="soft" onclick="goBack()">⬅ Back</button>
</div>

<script>
const $ = id => document.getElementById(id);
const TOTAL = 8;
let mode, queue = [], cur, entry = '', got = 0, locked = false, timer = null;

function load(k, d){ try { return JSON.parse(localStorage.getItem(k)) || d; } catch(e){ return d; } }
function store(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch(e){} }
const misses = load('hm', {});

for (let t = 1; t <= 12; t++){
  $('tables').innerHTML += `<button onclick="start(${t})">${t}s</button>`;
  $('printPick').innerHTML += `<button onclick="printOne(${t})">${t}s</button>`;
}
let p = '';
[1,2,3,4,5,6,7,8,9].forEach(n => p += `<button onclick="key(${n})">${n}</button>`);
p += `<button class="soft" onclick="back()" aria-label="Erase">⌫</button><button onclick="key(0)">0</button><button class="big" onclick="check()" aria-label="Check">✔</button>`;
$('pad').innerHTML = p;

function r(){ return 1 + Math.floor(Math.random() * 12); }

// Half the time in Mix/Division, bring back a fact he has missed before.
function pickMix(){
  const k = Object.keys(misses).filter(x => misses[x] > 0);
  if (k.length && Math.random() < .5) return k[Math.floor(Math.random() * k.length)].split('x').map(Number);
  return [r(), r()];
}

function start(m){
  mode = m; got = 0; queue = [];
  for (let i = 0; i < TOTAL; i++) queue.push(typeof m === 'number' ? [m, r()] : pickMix());
  $('modeName').textContent = typeof m === 'number' ? `The ${m}s` :
    {mix:'🔀 All tables, mixed', fam:'🔺 Fact families', div:'🟦 Division groups'}[m];
  side = (m === 'div' || m === 'fam') ? 'div' : 'mul';
  showOnly('game');
  next();
}

function stars(){ $('stars').textContent = '⭐'.repeat(got) + '☆'.repeat(Math.max(0, TOTAL - got)); }

function next(){
  locked = false; entry = '';
  $('entry').textContent = ''; $('msg').textContent = '';
  stars();
  if (got >= TOTAL){
    $('q').textContent = '🎉 You did it!';
    $('dots').innerHTML = '';
    $('entry').hidden = true; $('pad').hidden = true;
    speak('You did it! Great job!');
    return;
  }
  $('entry').hidden = mode === 'fam'; $('pad').hidden = false;  // in fact families the answer shows inside the ? circle
  cur = queue.shift() || pickMix();
  const [a, b] = cur;
  $('dots').innerHTML = '';
  if (mode === 'fam'){
    if (cur[2] === undefined) cur[2] = Math.floor(Math.random() * 3);  // which corner is hidden
    const h = cur[2], p = a * b;
    $('q').textContent = h === 0 ? `${a} × ${b} = ?` : h === 1 ? `${p} ÷ ${b} = ?` : `${p} ÷ ${a} = ?`;
    const c = (pos, val, i) => i === h ? `<div class="c ${pos} hole" id="hole">?</div>` : `<div class="c ${pos}">${val}</div>`;
    $('dots').innerHTML =
      `<div class="tri"><svg viewBox="0 0 260 210" aria-hidden="true"><polygon points="130,42 42,168 218,168" stroke-width="6" stroke-linejoin="round"/></svg>` +
      c('top', p, 0) + c('left', a, 1) + c('right', b, 2) + `</div>`;
  } else if (mode === 'div'){
    $('q').textContent = `${a*b} ÷ ${a}`;
    // Dots sit in a small rectangle inside each box (like dice), so the group size is easy to see.
    const cols = a <= 4 ? a : a <= 8 ? Math.ceil(a / 2) : Math.ceil(a / 3);
    let g = '';
    for (let i = 0; i < b; i++)
      g += `<div class="grp" style="grid-template-columns:repeat(${cols},14px)">` + '<span class="dot"></span>'.repeat(a) + '</div>';
    counted = 0;
    $('dots').innerHTML = `<p>${a*b} dots in groups of ${a}.<br>How many groups?</p><div id="groups">${g}</div><p class="hint">👆 Tap each group to count</p>`;
  } else {
    $('q').textContent = `${a} × ${b}`;
  }
  say();
}

function speak(t){
  if (!window.speechSynthesis) return;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(t);
  const v = window.bestVoice && bestVoice(); if (v){ u.voice = v; u.lang = v.lang; }
  u.rate = .9;
  speechSynthesis.speak(u);
}
function say(){
  if (!cur) return;
  const [a, b, h] = cur;
  if (mode === 'fam') speak(h === 0 ? `${a} times ${b}` : h === 1 ? `${a*b} divided by ${b}` : `${a*b} divided by ${a}`);
  else speak(mode === 'div' ? `${a*b} divided by ${a}` : `${a} times ${b}`);
}

// Tap-to-count: his finger keeps his place, the number shows up and is read aloud.
let counted = 0;
$('dots').addEventListener('click', e => {
  const box = e.target.closest('.grp');
  if (!box || box.classList.contains('done') || locked) return;
  counted++;
  box.classList.add('done');
  box.insertAdjacentHTML('beforeend', `<span class="n">${counted}</span>`);
  speak(String(counted));
});
function countAll(){
  counted = 0;
  document.querySelectorAll('.grp').forEach(box => {
    counted++;
    box.classList.add('done');
    const n = box.querySelector('.n');
    if (n) n.textContent = counted; else box.insertAdjacentHTML('beforeend', `<span class="n">${counted}</span>`);
  });
}

function showEntry(){
  $('entry').textContent = entry;
  if (mode === 'fam' && $('hole')) $('hole').textContent = entry || '?';
}
function key(n){ if (locked || entry.length >= 3) return; entry += n; showEntry(); }
function back(){ if (locked) return; entry = entry.slice(0, -1); showEntry(); }

function check(){
  if (locked || !entry) return;
  locked = true;
  const [a, b, h] = cur;
  const p = a * b;
  const ans = mode === 'div' ? b : mode === 'fam' ? [p, a, b][h] : p;
  const id = a + 'x' + b;
  if (mode === 'fam'){ $('hole').textContent = ans; $('hole').classList.add('good'); }
  if (+entry === ans){
    got++;
    if (misses[id]) misses[id]--;
    store('hm', misses);
    $('msg').textContent = '✅ Yes!';
    speak('Yes!');
    timer = setTimeout(next, 900);
  } else {
    misses[id] = (misses[id] || 0) + 2;
    store('hm', misses);
    if (mode === 'div') countAll();  // number every group so he can see the answer
    let fact, said;
    if (mode === 'div'){
      fact = `${b} groups of ${a} = ${p}, so ${p} ÷ ${a} = ${b}`;
      said = `${b} groups of ${a} is ${p}. So the answer is ${b}`;
    } else if (mode === 'fam' && h > 0){
      const d = h === 1 ? b : a;  // the number he divided by
      fact = `${a} × ${b} = ${p}, so ${p} ÷ ${d} = ${ans}`;
      said = `${a} times ${b} is ${p}. So ${p} divided by ${d} is ${ans}`;
    } else {
      fact = `${a} × ${b} = ${p}`;
      said = `${a} times ${b} is ${p}`;
    }
    $('msg').textContent = 'Good try! ' + fact;
    speak(said);
    // Bring the same fact back a couple of questions later so he has to recall it.
    queue.splice(Math.min(2, queue.length), 0, cur);
    timer = setTimeout(next, mode === "div" || mode === "fam" ? 5000 : 3500);
  }
}


// ---- Screens ----
let side = '';  // 'mul' (green) or 'div' (orange)
function showOnly(id){
  ['doors', 'mulMenu', 'divMenu', 'printMenu', 'game', 'chartView'].forEach(x => $(x).hidden = x !== id);
  document.body.dataset.side = id === 'doors' ? '' : side;
  window.scrollTo(0, 0);
}
function quiet(){
  clearTimeout(timer);
  stopRead();
  if (window.speechSynthesis) speechSynthesis.cancel();
}
function openPrint(){ side = 'mul'; showOnly('printMenu'); }
function printOne(n){ curT = n; printLists('one'); }
function openSide(s){ side = s; showOnly(s === 'mul' ? 'mulMenu' : 'divMenu'); }
function home(){ quiet(); side = ''; showOnly('doors'); }
function goBack(){ quiet(); openSide(side || 'mul'); }
// division.html links back with #div so he lands on the orange side
if (location.hash === '#div') openSide('div');

// ---- Chart: tap a row and a column to light them up ----
let selR = 0, selC = 0;
(function buildChart(){
  let h = '<tr><th>×</th>';
  for (let c = 1; c <= 12; c++) h += `<th data-c="${c}">${c}</th>`;
  h += '</tr>';
  for (let r = 1; r <= 12; r++){
    h += `<tr><th data-r="${r}">${r}</th>`;
    for (let c = 1; c <= 12; c++) h += `<td data-r="${r}" data-c="${c}"${r === c ? ' class="sq"' : ''}>${r*c}</td>`;
    h += '</tr>';
  }
  $('grid').innerHTML = h;
  $('grid').addEventListener('click', e => {
    const el = e.target.closest('td,th'); if (!el) return;
    const r = +el.dataset.r || 0, c = +el.dataset.c || 0;
    if (r && c){ selR = r; selC = c; }       // tapped an answer
    else if (r){ selR = r; }                  // tapped a row number
    else if (c){ selC = c; }                  // tapped a column number
    paint();
  });
})();

function paint(){
  $('grid').classList.toggle('focusing', !!(selR || selC));
  document.querySelectorAll('#grid td, #grid th').forEach(el => {
    const r = +el.dataset.r || 0, c = +el.dataset.c || 0;
    el.classList.toggle('hit', r === selR && c === selC && r > 0 && c > 0);
    el.classList.toggle('on', (selR && r === selR) || (selC && c === selC));
  });
  if (selR && selC){
    $('fact').textContent = `${selR} × ${selC} = ${selR*selC}`;
    speak(`${selR} times ${selC} is ${selR*selC}`);
  } else {
    $('fact').textContent = selR ? `The ${selR}s` : `The ${selC}s`;
  }
}

function openChart(){
  selR = 0; selC = 0;
  $('grid').classList.remove('focusing');
  document.querySelectorAll('#grid .on, #grid .hit').forEach(el => el.classList.remove('on', 'hit'));
  $('fact').textContent = 'Tap a number';
  side = 'mul';
  showOnly('chartView');
  tab('lists');
  showList(curT);
}

function tab(t){
  stopRead();
  $('listsPane').hidden = t !== 'lists';
  $('gridPane').hidden = t !== 'grid';
  $('tabL').classList.toggle('sel', t === 'lists');
  $('tabG').classList.toggle('sel', t === 'grid');
}

// ---- Lists: one table at a time, like the old printed pages ----
let curT = 1, reading = false, readTimer = null, readMode = 'facts';  // 'facts' = 7 times 1 is 7, 'count' = 7, 14, 21
for (let n = 1; n <= 12; n++) $('pickL').innerHTML += `<button data-n="${n}" onclick="showList(${n})">${n}s</button>`;

function rows(n){
  let h = '';
  for (let i = 1; i <= 12; i++)
    h += `<tr data-i="${i}"><td class="n">${n}</td><td>×</td><td class="n">${i}</td><td>=</td><td class="c">${n*i}</td></tr>`;
  return h;
}

function showList(n){
  stopRead();
  curT = n;
  $('countBtn').textContent = `🔢 Count by ${n}s`;  // label follows the table he picked
  $('list').innerHTML = rows(n);
  document.querySelectorAll('#pickL button').forEach(b => b.classList.toggle('sel', +b.dataset.n === n));
}

function setLine(i){
  document.querySelectorAll('#list tr').forEach(tr => tr.classList.toggle('on', +tr.dataset.i === i));
}

$('list').addEventListener('click', e => {
  const tr = e.target.closest('tr'); if (!tr) return;
  stopRead();
  const i = +tr.dataset.i;
  setLine(i);
  speak(`${curT} times ${i} is ${curT*i}`);
});

// Reads the table top to bottom, moving the yellow line along with the voice.
function readAll(){ startRead('facts'); }
// Skip counting: just the answers (7, 14, 21 ... 84), highlight moving down with the voice.
function readCount(){ startRead('count'); }
function startRead(m){
  const same = reading && readMode === m;
  stopRead();
  if (same) return;                 // tapping the same button again stops it
  readMode = m;
  reading = true;
  $(m === 'count' ? 'countBtn' : 'readBtn').textContent = '■ Stop';
  step(1);
}
function step(i){
  if (!reading) return;
  if (i > 12){ stopRead(); return; }
  setLine(i);
  const t = readMode === 'count' ? String(curT * i) : `${curT} times ${i} is ${curT*i}`;
  if (window.speechSynthesis){
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(t);
    const v = window.bestVoice && bestVoice(); if (v){ u.voice = v; u.lang = v.lang; }
    u.rate = .85;
    u.onend = () => { readTimer = setTimeout(() => step(i + 1), readMode === 'count' ? 300 : 400); };
    speechSynthesis.speak(u);
  } else {
    readTimer = setTimeout(() => step(i + 1), 2200);
  }
}
function stopRead(){
  if (!reading) return;
  reading = false;
  clearTimeout(readTimer);
  if (window.speechSynthesis) speechSynthesis.cancel();
  $('readBtn').textContent = '▶ Read it to me';
  $('countBtn').textContent = `🔢 Count by ${curT}s`;
}

// ---- Printing ----
function box(n){ return `<div class="box c${(n - 1) % 3 + 1}"><h3>The ${n}s</h3><table>${rows(n)}</table></div>`; }
function setPage(o, side = '.4in'){ $('pageSize').textContent = `@page{size:${o};margin:.4in ${side}}`; }
function printLists(which){
  stopRead();
  let h = '';
  if (which === 'one') h = `<div class="one">${box(curT)}</div>`;
  else {
    const foot = (p, of) => `<div class="pfoot">Page ${p} of ${of}</div>`;
    if (which === 'each'){
      // every table on its own page (12 pages)
      for (let n = 1; n <= 12; n++) h += `<div class="sheet"><div class="one">${box(n)}</div>${foot(n, 12)}</div>`;
    } else {
      // 3 tables side by side per page (4 pages): big enough to track easily
      for (let pg = 0; pg < 4; pg++){
        h += '<div class="sheet"><div class="pg">';
        for (let n = pg*3 + 1; n <= pg*3 + 3; n++) h += box(n);
        h += `</div>${foot(pg + 1, 4)}</div>`;
      }
    }
  }
  $('printArea').innerHTML = h;
  setPage('portrait');  // table sheets print tall
  document.body.dataset.print = 'lists';
  window.print();
}
function printGrid(){
  setPage('portrait', '.3in');  // slimmer side margins so the grid can be wider
  document.body.dataset.print = 'grid';
  window.print();
}

// A keyboard works too, for practice on a computer.
document.addEventListener('keydown', e => {
  if ($('game').hidden) return;
  if (/^[0-9]$/.test(e.key)) key(+e.key);
  else if (e.key === 'Backspace') back();
  else if (e.key === 'Enter') check();
  else return;
  e.preventDefault(); // stop Enter from also "clicking" the last tapped button
});

</script>
