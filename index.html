<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Holden's Math</title>
<style>
body{font-family:Verdana,Tahoma,sans-serif;background:#fdf6e3;color:#222;text-align:center;margin:0;padding:12px;letter-spacing:.05em}
h1{font-size:28px;margin:6px}
button{font-family:inherit;font-size:24px;margin:5px;padding:14px 18px;border:0;border-radius:14px;background:#3b7dd8;color:#fff;min-width:64px;cursor:pointer;touch-action:manipulation}
button:active{transform:scale(.96)}
.big{background:#2e9e5b}.soft{background:#999}
#streak{font-size:22px;margin-bottom:6px}
#q{font-size:60px;margin:10px;font-weight:bold}
#entry{font-size:52px;min-height:64px;border-bottom:4px solid #3b7dd8;width:180px;margin:0 auto 10px}
#pad{max-width:330px;margin:auto}
#pad button{width:90px;height:72px;font-size:32px;padding:0}
#msg{font-size:26px;min-height:70px;margin:8px;line-height:1.5}
#stars{font-size:32px}
.dot{display:inline-block;width:12px;height:12px;margin:2px;border-radius:50%;background:#f28c28}
#dots p{font-size:20px}

/* Chart */
#chartView h2{font-size:26px;margin:6px}
#fact{font-size:40px;font-weight:bold;min-height:56px;margin:6px}
#wrap{overflow-x:auto;margin:0 auto;max-width:100%}
#grid{border-collapse:collapse;margin:0 auto;font-size:clamp(14px,3.6vw,24px)}
#grid td,#grid th{width:2.1em;height:2.1em;text-align:center;border:1px solid #e4dccb;cursor:pointer;padding:0}
#grid th{background:#3b7dd8;color:#fff}
#grid tr:nth-child(odd) td{background:#f4ecd8}
#grid tr:nth-child(even) td{background:#fffdf7}
#grid td.sq{background:#cfe8d6!important;font-weight:bold}
#grid td.on,#grid th.on{background:#ffe08a!important}
#grid td.hit{background:#f28c28!important;color:#fff;font-weight:bold}
#grid th.on{color:#222}
/* fade everything except the chosen row/column, so his eyes have less to sort through */
#grid.focusing td:not(.on){opacity:.25}

.tabs button{background:#8aa6cc}
.tabs button.sel{background:#3b7dd8;outline:3px solid #222}

/* Lists: one table at a time, big and spaced out */
#pickL button{min-width:56px;padding:10px 12px;font-size:22px}
#pickL button.sel{background:#f28c28}
#list{margin:12px auto;border-collapse:collapse;font-size:clamp(28px,7vw,42px)}
#list td{padding:.1em .22em}
#list tr{cursor:pointer}
#list tr:nth-child(odd){background:#f4ecd8}
#list tr:nth-child(even){background:#fffdf7}
#list tr.on{background:#ffe08a;outline:4px solid #f28c28}
#list td.n{text-align:right}
#list td.c{text-align:left;font-weight:bold;min-width:2.2em}
#printArea{display:none}

@media print{
  @page{size:landscape;margin:.4in}
  body{background:#fff;padding:0}
  h1,#streak,#menu,#game,.noprint{display:none!important}
  body[data-print="grid"] #chartView{display:block!important}
  body[data-print="grid"] #listsPane{display:none!important}
  body[data-print="grid"] #gridPane{display:block!important}
  body[data-print="lists"] #chartView{display:none!important}
  body[data-print="lists"] #printArea{display:block!important}
  #grid td{opacity:1!important}
  #printArea table{margin:0 auto;border-collapse:collapse;font-size:20px;line-height:1.2}
  #printArea td{padding:0 4px}
  #printArea td:first-child{padding-left:.8em}
  #printArea td:last-child{padding-right:.8em}
  #printArea td.n{text-align:right}
  #printArea td.c{text-align:left;font-weight:bold;min-width:2.2em}
  #printArea tr:nth-child(odd){background:#f4ecd8}
  #printArea .box{border:2px solid #3b7dd8;border-radius:10px;padding:4px 6px 6px;break-inside:avoid}
  #printArea h3{margin:0 0 4px;font-size:22px;background:#3b7dd8;color:#fff;border-radius:6px;padding:2px}
  #printArea .pg{display:grid;grid-template-columns:repeat(3,1fr);gap:.22in;break-after:page}
  #printArea .pg:last-child{break-after:auto}
  #printArea .one .box{max-width:5in;margin:0 auto;border:0;padding:0}
  #printArea .one h3{font-size:34px;margin-bottom:6px}
  #printArea .one table{font-size:40px;line-height:1.22}
  #chartView h2{font-size:28px;margin:0 0 8px}
  #grid{font-size:24px}
  #grid td,#grid th{border:1px solid #999;width:52px;height:50px}
  #grid td.on,#grid td.hit{color:#222!important;font-weight:normal}
  #grid tr:nth-child(odd) td{background:#f4ecd8!important}
  #grid tr:nth-child(even) td{background:#fffdf7!important}
  #grid tr td.sq{background:#cfe8d6!important;font-weight:bold}
  #grid th.on{background:#3b7dd8!important;color:#fff}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
</style>
</head>
<body>
<h1>Holden's Math</h1>
<div id="streak"></div>

<div id="menu">
  <p style="font-size:22px">Pick a table:</p>
  <div id="tables"></div>
  <button class="big" onclick="start('mix')">Mix it up</button>
  <button class="big" onclick="start('div')">Division dots</button>
  <br><button class="big" style="background:#f28c28" onclick="openChart()">📋 Chart</button>
</div>

<div id="chartView" hidden>
  <h2>Times Tables</h2>
  <div class="tabs noprint">
    <button id="tabL" onclick="tab('lists')">Lists</button>
    <button id="tabG" onclick="tab('grid')">Grid</button>
  </div>

  <div id="listsPane">
    <div id="pickL" class="noprint"></div>
    <table id="list"></table>
    <div class="noprint">
      <button class="big" id="readBtn" onclick="readAll()">▶ Read it to me</button><br>
      <button onclick="printLists('one')">🖨 Print this table</button>
      <button onclick="printLists('all')">🖨 Print all 12</button>
    </div>
  </div>

  <div id="gridPane" hidden>
    <div id="fact" class="noprint">Tap a number</div>
    <div id="wrap"><table id="grid"></table></div>
    <div class="noprint"><button class="big" onclick="printGrid()">🖨 Print</button></div>
  </div>

  <div class="noprint"><button class="soft" onclick="home()">Home</button></div>
</div>
<div id="printArea"></div>

<div id="game" hidden>
  <div id="stars"></div>
  <div id="q"></div>
  <button onclick="say()" aria-label="Read it to me">🔊</button>
  <div id="dots"></div>
  <div id="entry"></div>
  <div id="pad"></div>
  <div id="msg"></div>
  <button class="soft" onclick="home()">Home</button>
</div>

<script>
const $ = id => document.getElementById(id);
const TOTAL = 8;
let mode, queue = [], cur, entry = '', got = 0, locked = false, timer = null;

function load(k, d){ try { return JSON.parse(localStorage.getItem(k)) || d; } catch(e){ return d; } }
function store(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch(e){} }
const misses = load('hm', {});

for (let t = 1; t <= 12; t++) $('tables').innerHTML += `<button onclick="start(${t})">${t}s</button>`;
let p = '';
[1,2,3,4,5,6,7,8,9].forEach(n => p += `<button onclick="key(${n})">${n}</button>`);
p += `<button class="soft" onclick="back()" aria-label="Erase">⌫</button><button onclick="key(0)">0</button><button class="big" onclick="check()" aria-label="Check">✔</button>`;
$('pad').innerHTML = p;

function r(){ return 1 + Math.floor(Math.random() * 12); }

// Half the time in Mix/Division, bring back a fact he has missed before.
function pickMix(){
  const k = Object.keys(misses).filter(x => misses[x] > 0);
  if (k.length && Math.random() < .5) return k[Math.floor(Math.random() * k.length)].split('x').map(Number);
  return [r(), r()];
}

function start(m){
  mode = m; got = 0; queue = [];
  for (let i = 0; i < TOTAL; i++) queue.push(typeof m === 'number' ? [m, r()] : pickMix());
  $('menu').hidden = true; $('game').hidden = false;
  next();
}

function stars(){ $('stars').textContent = '⭐'.repeat(got) + '☆'.repeat(Math.max(0, TOTAL - got)); }

function next(){
  locked = false; entry = '';
  $('entry').textContent = ''; $('msg').textContent = '';
  stars();
  if (got >= TOTAL){
    $('q').textContent = '🎉 You did it!';
    $('dots').innerHTML = '';
    $('entry').hidden = true; $('pad').hidden = true;
    speak('You did it! Great job Holden!');
    streak();
    return;
  }
  $('entry').hidden = false; $('pad').hidden = false;
  cur = queue.shift() || pickMix();
  const [a, b] = cur;
  $('dots').innerHTML = '';
  if (mode === 'div'){
    $('q').textContent = `${a*b} ÷ ${a}`;
    let h = '';
    for (let i = 0; i < b; i++) h += '<div>' + '<span class="dot"></span>'.repeat(a) + '</div>';
    h += `<p>${a*b} dots, ${a} in each row. How many rows?</p>`;
    $('dots').innerHTML = h;
  } else {
    $('q').textContent = `${a} × ${b}`;
  }
  say();
}

function speak(t){
  if (!window.speechSynthesis) return;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(t);
  u.rate = .85;
  speechSynthesis.speak(u);
}
function say(){
  if (!cur) return;
  const [a, b] = cur;
  speak(mode === 'div' ? `${a*b} divided by ${a}` : `${a} times ${b}`);
}

function key(n){ if (locked || entry.length >= 3) return; entry += n; $('entry').textContent = entry; }
function back(){ if (locked) return; entry = entry.slice(0, -1); $('entry').textContent = entry; }

function check(){
  if (locked || !entry) return;
  locked = true;
  const [a, b] = cur;
  const ans = mode === 'div' ? b : a * b;
  const id = a + 'x' + b;
  if (+entry === ans){
    got++;
    if (misses[id]) misses[id]--;
    store('hm', misses);
    $('msg').textContent = '✅ Yes!';
    speak('Yes!');
    timer = setTimeout(next, 900);
  } else {
    misses[id] = (misses[id] || 0) + 2;
    store('hm', misses);
    const fact = mode === 'div' ? `${a} × ${b} = ${a*b}, so ${a*b} ÷ ${a} = ${b}` : `${a} × ${b} = ${a*b}`;
    $('msg').textContent = 'Good try! ' + fact;
    speak(mode === 'div' ? `${a} times ${b} is ${a*b}. So the answer is ${b}` : `${a} times ${b} is ${a*b}`);
    // Bring the same fact back a couple of questions later so he has to recall it.
    queue.splice(Math.min(2, queue.length), 0, cur);
    timer = setTimeout(next, 3500);
  }
}

function streak(){
  const d = new Date().toDateString(), y = new Date(Date.now() - 864e5).toDateString();
  const s = load('hs', {n:0, d:''});
  if (s.d !== d){ s.n = s.d === y ? s.n + 1 : 1; s.d = d; store('hs', s); }
  show();
}
function show(){ const n = load('hs', {n:0}).n; $('streak').textContent = '🔥 Streak: ' + n + (n === 1 ? ' day' : ' days'); }

function home(){
  clearTimeout(timer);
  stopRead();
  if (window.speechSynthesis) speechSynthesis.cancel();
  $('menu').hidden = false; $('game').hidden = true; $('chartView').hidden = true;
  show();
}

// ---- Chart: tap a row and a column to light them up ----
let selR = 0, selC = 0;
(function buildChart(){
  let h = '<tr><th>×</th>';
  for (let c = 1; c <= 12; c++) h += `<th data-c="${c}">${c}</th>`;
  h += '</tr>';
  for (let r = 1; r <= 12; r++){
    h += `<tr><th data-r="${r}">${r}</th>`;
    for (let c = 1; c <= 12; c++) h += `<td data-r="${r}" data-c="${c}"${r === c ? ' class="sq"' : ''}>${r*c}</td>`;
    h += '</tr>';
  }
  $('grid').innerHTML = h;
  $('grid').addEventListener('click', e => {
    const el = e.target.closest('td,th'); if (!el) return;
    const r = +el.dataset.r || 0, c = +el.dataset.c || 0;
    if (r && c){ selR = r; selC = c; }       // tapped an answer
    else if (r){ selR = r; }                  // tapped a row number
    else if (c){ selC = c; }                  // tapped a column number
    paint();
  });
})();

function paint(){
  $('grid').classList.toggle('focusing', !!(selR || selC));
  document.querySelectorAll('#grid td, #grid th').forEach(el => {
    const r = +el.dataset.r || 0, c = +el.dataset.c || 0;
    el.classList.toggle('hit', r === selR && c === selC && r > 0 && c > 0);
    el.classList.toggle('on', (selR && r === selR) || (selC && c === selC));
  });
  if (selR && selC){
    $('fact').textContent = `${selR} × ${selC} = ${selR*selC}`;
    speak(`${selR} times ${selC} is ${selR*selC}`);
  } else {
    $('fact').textContent = selR ? `The ${selR}s` : `The ${selC}s`;
  }
}

function openChart(){
  selR = 0; selC = 0;
  $('grid').classList.remove('focusing');
  document.querySelectorAll('#grid .on, #grid .hit').forEach(el => el.classList.remove('on', 'hit'));
  $('fact').textContent = 'Tap a number';
  $('menu').hidden = true; $('game').hidden = true; $('chartView').hidden = false;
  tab('lists');
  showList(curT);
}

function tab(t){
  stopRead();
  $('listsPane').hidden = t !== 'lists';
  $('gridPane').hidden = t !== 'grid';
  $('tabL').classList.toggle('sel', t === 'lists');
  $('tabG').classList.toggle('sel', t === 'grid');
}

// ---- Lists: one table at a time, like the old printed pages ----
let curT = 1, reading = false, readTimer = null;
for (let n = 1; n <= 12; n++) $('pickL').innerHTML += `<button data-n="${n}" onclick="showList(${n})">${n}s</button>`;

function rows(n){
  let h = '';
  for (let i = 1; i <= 12; i++)
    h += `<tr data-i="${i}"><td class="n">${n}</td><td>×</td><td class="n">${i}</td><td>=</td><td class="c">${n*i}</td></tr>`;
  return h;
}

function showList(n){
  stopRead();
  curT = n;
  $('list').innerHTML = rows(n);
  document.querySelectorAll('#pickL button').forEach(b => b.classList.toggle('sel', +b.dataset.n === n));
}

function setLine(i){
  document.querySelectorAll('#list tr').forEach(tr => tr.classList.toggle('on', +tr.dataset.i === i));
}

$('list').addEventListener('click', e => {
  const tr = e.target.closest('tr'); if (!tr) return;
  stopRead();
  const i = +tr.dataset.i;
  setLine(i);
  speak(`${curT} times ${i} is ${curT*i}`);
});

// Reads the table top to bottom, moving the yellow line along with the voice.
function readAll(){
  if (reading){ stopRead(); return; }
  reading = true;
  $('readBtn').textContent = '■ Stop';
  step(1);
}
function step(i){
  if (!reading) return;
  if (i > 12){ stopRead(); return; }
  setLine(i);
  const t = `${curT} times ${i} is ${curT*i}`;
  if (window.speechSynthesis){
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(t);
    u.rate = .8;
    u.onend = () => { readTimer = setTimeout(() => step(i + 1), 400); };
    speechSynthesis.speak(u);
  } else {
    readTimer = setTimeout(() => step(i + 1), 2200);
  }
}
function stopRead(){
  if (!reading) return;
  reading = false;
  clearTimeout(readTimer);
  if (window.speechSynthesis) speechSynthesis.cancel();
  $('readBtn').textContent = '▶ Read it to me';
}

// ---- Printing ----
function box(n){ return `<div class="box"><h3>The ${n}s</h3><table>${rows(n)}</table></div>`; }
function printLists(which){
  stopRead();
  let h = '';
  if (which === 'one') h = `<div class="one">${box(curT)}</div>`;
  else {
    // 6 tables per page (2 pages) keeps the print big enough to track
    for (let pg = 0; pg < 2; pg++){
      h += '<div class="pg">';
      for (let n = pg*6 + 1; n <= pg*6 + 6; n++) h += box(n);
      h += '</div>';
    }
  }
  $('printArea').innerHTML = h;
  document.body.dataset.print = 'lists';
  window.print();
}
function printGrid(){
  document.body.dataset.print = 'grid';
  window.print();
}

// A keyboard works too, for practice on a computer.
document.addEventListener('keydown', e => {
  if ($('game').hidden) return;
  if (/^[0-9]$/.test(e.key)) key(+e.key);
  else if (e.key === 'Backspace') back();
  else if (e.key === 'Enter') check();
  else return;
  e.preventDefault(); // stop Enter from also "clicking" the last tapped button
});

show();
</script>
</body>
</html>
